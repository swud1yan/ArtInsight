[project]
name = "artinsight"
version = "0.1.0"
description = "ArtInsight: PCA-based art style analysis and similar artwork retrieval."
requires-python = ">=3.12"
dependencies = [
    "PySide6==6.11.1",
    "numpy==2.2.6",
    "pandas==3.0.3",
    "matplotlib==3.10.7",
    "opencv-python==4.12.0.88",
    "scikit-learn==1.9.0",
    "scikit-image==0.26.0",
    "scipy==1.16.3",
    "SQLAlchemy==2.0.36",
    "joblib==1.5.3",
    "reportlab==5.0.0",
    "kaggle==2.2.3",
]

[project.optional-dependencies]
dev = [
    "pypdf==6.14.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
